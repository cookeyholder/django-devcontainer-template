  #     context: ..
  #     dockerfile: .devcontainer/Dockerfile
  #   command: >
  #     bash -c "
  #       echo 'Waiting for venv...';
  #       until [ -f /workspace/.venv/bin/celery ]; do sleep 5; done;
  #       cd /workspace/${DJANGO_PROJECT_DIR:-src} && /workspace/.venv/bin/celery -A config worker -l info --pool=solo
  #     "
  #   volumes:
  #     - ..:/workspace:cached
  #     - venv:/workspace/.venv
  #   environment:
  #     PYTHONUNBUFFERED: "1"
